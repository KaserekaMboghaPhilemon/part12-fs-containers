services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/phonebook-prod
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    volumes:
      - mongo_data_prod:/data/db

volumes:
  mongo_data_prod:
