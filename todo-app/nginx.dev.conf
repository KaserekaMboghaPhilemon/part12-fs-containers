events { }

http {
  server {
    listen 80;

    location / {
      # Required for Vite hot-reloading (WebSockets)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      
      # Route requests to the frontend service inside the Docker network
      proxy_pass http://app:5173;
    }
  }
}