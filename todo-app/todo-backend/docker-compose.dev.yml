version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: todo-backend-mongo-1
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    ports:
      - "3456:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  redis:
    image: redis:alpine
    container_name: todo-backend-redis-1
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo_data: